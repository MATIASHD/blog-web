server {
    listen 80;
    server_name arevdev.com www.arevdev.com;
    root /var/www/arevdev/public;
    index index.html;

    # El webhook (y cualquier endpoint dinamico futuro) va a Node
    location /webhook/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    #Todo lo demas se sirve como archivo estatico generado en el build
    location / {
        try_files $uri $uri/ $uri.html =404;   
    }

    # Cache agresivo para assets que no cambian seguido
    location /css/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}