upstream node_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name arevdev.com www.arevdev.com;
    root /home/matias/Documentos/blog/src/public;

    # --- Aggressive caching for fingerprinted / immutable assets ---
    location ~* \.(?:css|js|woff2?|ttf|eot|svg)$ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary Accept-Encoding;
        access_log off;
        try_files $uri =404;
    }

    # --- Images & uploads: cache 30 days ---
    location ~* \.(?:jpg|jpeg|png|gif|webp|ico|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary Accept-Encoding;
        access_log off;
        try_files $uri =404;
    }

    # --- Pre-built post pages: cache 1 hour, client can stale 1 day ---
    location /post/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri $uri/index.html =404;
    }

    # --- Static homepage (pre-built) ---
    location = / {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files /index.html =404;
    }

    # --- Sitemap & RSS ---
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files /sitemap.xml =404;
    }
    location = /rss.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files /rss.xml =404;
    }

    # --- Static pages (about, contact, etc.) ---
    location = /about {
        try_files /about/index.html /about.html @node;
    }
    location = /contact {
        try_files /contact/index.html /contact.html @node;
    }
    location = /newsletter {
        try_files /newsletter/index.html @node;
    }

    # --- Admin / dynamic routes → proxy to Node ---
    location /dashboard/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # No cache for admin
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    location /login {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # --- Webhook → Node ---
    location /webhook/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
        expires off;
    }

    # --- Catch-all: static files, fallback to Node ---
    location / {
        try_files $uri $uri/index.html @node;
    }

    # --- Fallback to Node.js Express ---
    location @node {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
}
